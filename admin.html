<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jigar's Books Chronicle - Admin Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        nav {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            padding: 10px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .btn-success {
            background: #48bb78;
            color: white;
        }

        .btn-success:hover {
            background: #38a169;
        }

        .btn-danger {
            background: #f56565;
            color: white;
        }

        .btn-danger:hover {
            background: #e53e3e;
        }

        .btn-secondary {
            background: #cbd5e0;
            color: #2d3748;
        }

        .btn-secondary:hover {
            background: #a0aec0;
        }

        .content {
            padding: 30px;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .search-bar {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }

        .search-bar input {
            flex: 1;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 5px;
            font-size: 1em;
        }

        .search-bar input:focus {
            outline: none;
            border-color: #667eea;
        }

        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .book-card {
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 15px;
            background: #f7fafc;
            transition: all 0.3s ease;
        }

        .book-card:hover {
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transform: translateY(-2px);
        }

        .book-title {
            font-weight: bold;
            font-size: 1.1em;
            color: #2d3748;
            margin-bottom: 5px;
        }

        .book-author {
            color: #718096;
            margin-bottom: 10px;
            font-style: italic;
        }

        .book-info {
            font-size: 0.9em;
            color: #4a5568;
            margin-bottom: 10px;
            line-height: 1.6;
        }

        .book-status {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .status-read {
            background: #bee3f8;
            color: #2c5282;
        }

        .status-to-read {
            background: #feebc8;
            color: #7c2d12;
        }

        .status-in-collection {
            background: #c6f6d5;
            color: #22543d;
        }

        .tracking-status {
            background: #fed7d7;
            color: #742a2a;
            padding: 8px;
            border-radius: 5px;
            font-weight: 500;
            margin-bottom: 10px;
            font-size: 0.9em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2d3748;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 2px solid #e2e8f0;
            border-radius: 5px;
            font-size: 1em;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
            background: #f0f4ff;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .book-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .book-actions button {
            flex: 1;
            padding: 8px;
            font-size: 0.9em;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 10px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .modal-header {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 20px;
            color: #2d3748;
        }

        .close-modal {
            float: right;
            font-size: 2em;
            font-weight: bold;
            color: #718096;
            cursor: pointer;
            line-height: 1;
        }

        .close-modal:hover {
            color: #2d3748;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .stat-label {
            font-size: 1em;
            opacity: 0.9;
        }

        .tracking-selector {
            display: grid;
            gap: 10px;
        }

        .tracking-option {
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 5px;
            cursor: pointer;
            background: #f7fafc;
            transition: all 0.3s;
        }

        .tracking-option:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .tracking-option.selected {
            border-color: #667eea;
            background: #edf2f7;
            font-weight: 600;
        }

        .message {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .message.success {
            display: block;
            background: #c6f6d5;
            border: 1px solid #9ae6b4;
            color: #22543d;
        }

        .message.error {
            display: block;
            background: #fed7d7;
            border: 1px solid #fc8181;
            color: #742a2a;
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: #718096;
        }

        .filter-panel {
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .filter-header {
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-header:hover {
            color: #667eea;
        }

        .filter-content {
            display: none;
        }

        .filter-content.expanded {
            display: block;
        }

        .filter-options {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }

        .filter-checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-checkbox:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .filter-checkbox input {
            cursor: pointer;
            width: 18px;
            height: 18px;
        }

        .filter-button-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .filter-button-group button {
            flex: 1;
            padding: 8px 12px;
            font-size: 0.9em;
        }

        .rating-filters {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }

        .favorite-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ffd700;
            color: #744210;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.8em;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .dashboard-card {
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            padding: 20px;
        }

        .dashboard-card h3 {
            color: #2d3748;
            margin-bottom: 15px;
            font-size: 1.1em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .dashboard-stat {
            margin-bottom: 15px;
            padding: 10px;
            background: #f7fafc;
            border-radius: 5px;
        }

        .dashboard-stat-label {
            font-size: 0.9em;
            color: #718096;
            margin-bottom: 5px;
        }

        .dashboard-stat-value {
            font-size: 1.8em;
            font-weight: bold;
            color: #667eea;
        }

        .recommendation-card {
            border: 2px solid #ffd700;
            background: #fffbf0;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .recommendation-card .book-title {
            color: #744210;
        }

        .prediction-badge {
            display: inline-block;
            background: #ffd700;
            color: #744210;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.9em;
            font-weight: bold;
            margin-top: 8px;
        }

        .book-card {
            position: relative;
        }

        @media (max-width: 768px) {
            .books-grid {
                grid-template-columns: 1fr;
            }
            
            .form-row {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 1.8em;
            }

            nav {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 Jigar's Books Chronicle</h1>
            <p>Admin Panel - Manage Your Book Collection</p>
        </header>

        <nav>
            <button class="btn-primary" onclick="showSection('browse')">📖 Browse & Edit</button>
            <button class="btn-primary" onclick="showSection('dashboard')">📊 Dashboard</button>
            <button class="btn-primary" onclick="showSection('tracking')">📍 Track Books</button>
            <button class="btn-primary" onclick="showSection('add')">➕ Add Book</button>
            <button class="btn-success" onclick="downloadJSON()">⬇️ Download JSON</button>
            <button class="btn-secondary" onclick="loadFromFile()">⬆️ Load from File</button>
            <button id="githubBtn" class="btn-success" onclick="toggleGitHubAuth()" style="display:none;">🔒 Login to GitHub</button>
            <button id="saveGithubBtn" class="btn-success" onclick="saveToGitHub()" style="display:none;">💾 Save to GitHub</button>
        </nav>

        <div class="content">
            <div id="message" class="message"></div>

            <!-- Browse Section -->
            <div id="browse" class="section active">
                <h2>Browse & Edit Books</h2>
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="Search by title or author...">
                    <button class="btn-primary" onclick="filterBooks()">🔍 Search</button>
                </div>

                <!-- Filter Panel -->
                <div class="filter-panel">
                    <div class="filter-header" onclick="toggleFilterPanel()">
                        <span>🔽 Filters</span>
                        <span id="filterToggleIcon" style="font-size: 0.8em;">▼</span>
                    </div>
                    <div class="filter-content expanded" id="filterContent">
                        <div style="margin-bottom: 15px;">
                            <div style="font-weight: 500; margin-bottom: 10px; color: #2d3748;">📚 Collection</div>
                            <div class="filter-checkbox">
                                <input type="checkbox" id="filterInCollection" onchange="filterBooks()">
                                <label for="filterInCollection" style="cursor: pointer; margin: 0;">Only show books in my collection</label>
                            </div>
                        </div>

                        <div style="margin-bottom: 15px;">
                            <div style="font-weight: 500; margin-bottom: 10px; color: #2d3748;">⭐ Rating</div>
                            <div class="rating-filters" id="ratingFilters"></div>
                        </div>

                        <div>
                            <div style="font-weight: 500; margin-bottom: 10px; color: #2d3748;">🏷️ Categories</div>
                            <div class="filter-options" id="categoryFilters"></div>
                        </div>

                        <div class="filter-button-group">
                            <button class="btn-secondary" onclick="clearFilters()">↻ Clear All</button>
                            <button class="btn-primary" onclick="filterBooks()">✓ Apply Filters</button>
                        </div>
                    </div>
                </div>

                <div id="browseStats" class="stats"></div>

                <div id="booksGrid" class="books-grid"></div>
                <div id="noResults" class="no-results" style="display:none;">No books found</div>
            </div>

            <!-- Dashboard Section -->
            <div id="dashboard" class="section">
                <h2>📊 Reading Dashboard</h2>
                <div id="dashboardContent"></div>
            </div>

            <!-- Tracking Section -->
            <div id="tracking" class="section">
                <h2>Track Lent/Lost Books</h2>
                <div class="search-bar">
                    <input type="text" id="trackingSearch" placeholder="Search for book...">
                    <button class="btn-primary" onclick="filterTrackingBooks()">🔍 Search</button>
                </div>
                <div id="trackingGrid" class="books-grid"></div>
            </div>

            <!-- Add Book Section -->
            <div id="add" class="section">
                <h2>Add New Book</h2>
                <div style="max-width: 600px;">
                    <form id="addBookForm" onsubmit="addNewBook(event)">
                        <div class="form-group">
                            <label>Title *</label>
                            <input type="text" id="newTitle" required>
                        </div>

                        <div class="form-group">
                            <label>Author *</label>
                            <input type="text" id="newAuthor" required>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label>Rating (1-5)</label>
                                <input type="number" id="newRating" min="1" max="5" value="3">
                            </div>

                            <div class="form-group">
                                <label>Status</label>
                                <select id="newStatus">
                                    <option>read</option>
                                    <option>to-read</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Category</label>
                            <input type="text" id="newCategory" placeholder="e.g., Fiction/Mystery">
                        </div>

                        <div class="form-group">
                            <label>In Collection</label>
                            <select id="newInCollection">
                                <option value="true">Yes</option>
                                <option value="false">No</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Pages</label>
                            <input type="number" id="newPages">
                        </div>

                        <div class="form-group">
                            <label>Review</label>
                            <textarea id="newReview" placeholder="Your thoughts on this book..."></textarea>
                        </div>

                        <div class="form-group">
                            <label>Tracking Status (optional)</label>
                            <input type="text" id="newTracking" placeholder="e.g., 'Lent to John' or 'Lost'">
                        </div>

                        <button type="submit" class="btn-success" style="width: 100%; padding: 12px;">Add Book</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <div class="modal-header">Edit Book</div>
            <form id="editForm" onsubmit="saveBook(event)">
                <input type="hidden" id="editIndex">

                <div class="form-group">
                    <label>Title</label>
                    <input type="text" id="editTitle" required>
                </div>

                <div class="form-group">
                    <label>Author</label>
                    <input type="text" id="editAuthor" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Rating (1-5)</label>
                        <input type="number" id="editRating" min="1" max="5">
                    </div>

                    <div class="form-group">
                        <label>Status</label>
                        <select id="editStatus">
                            <option>read</option>
                            <option>to-read</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Category</label>
                    <input type="text" id="editCategory">
                </div>

                <div class="form-group">
                    <label>In Collection</label>
                    <select id="editInCollection">
                        <option value="true">Yes</option>
                        <option value="false">No</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Pages</label>
                    <input type="text" id="editPages">
                </div>

                <div class="form-group">
                    <label>Review</label>
                    <textarea id="editReview"></textarea>
                </div>

                <div class="form-group">
                    <label>Tracking Status (for lent/lost books)</label>
                    <input type="text" id="editTracking" placeholder="e.g., 'Lent to John', 'Lost'">
                </div>

                <button type="submit" class="btn-success" style="width: 100%; margin-bottom: 10px;">Save Changes</button>
                <button type="button" class="btn-danger" style="width: 100%;" onclick="deleteBook()">Delete Book</button>
            </form>
        </div>
    </div>

    <!-- Tracking Modal -->
    <div id="trackingModal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeTrackingModal()">&times;</span>
            <div class="modal-header" id="trackingTitle"></div>
            
            <div class="form-group">
                <label>Update Status:</label>
                <div class="tracking-selector">
                    <div class="tracking-option" onclick="selectTracking(this, 'in_collection')">
                        ✓ In My Collection
                    </div>
                    <div class="tracking-option" onclick="selectTracking(this, 'lent')">
                        📤 Lent to someone
                    </div>
                    <div class="tracking-option" onclick="selectTracking(this, 'lost')">
                        ❌ Lost
                    </div>
                </div>
            </div>

            <div id="lentForm" style="display: none;">
                <div class="form-group">
                    <label>Person's Name:</label>
                    <input type="text" id="lentPerson" placeholder="Enter name">
                </div>
                <div class="form-group">
                    <label>Lent on (optional):</label>
                    <input type="date" id="lentDate">
                </div>
            </div>

            <button onclick="saveTrackingStatus()" class="btn-success" style="width: 100%; margin-top: 20px;">Save Tracking Status</button>
        </div>
    </div>

    <script>
        let libraryData = null;
        let filteredBooks = null;
        let currentEditIndex = -1;
        let selectedTrackingBook = -1;
        let selectedTrackingType = null;
        let selectedCategories = new Set();
        let selectedRatings = new Set();

        // Initialize
        window.onload = function() {
            loadLibraryData();
        };

        function loadLibraryData() {
            fetch('library_data.json')
                .then(response => response.json())
                .then(data => {
                    libraryData = data;
                    filteredBooks = data.books;
                    renderBrowseBooks();
                    updateStats();
                    buildCategoryFilters();
                    buildRatingFilters();
                    showMessage('Library loaded successfully', 'success');
                })
                .catch(error => {
                    showMessage('Error loading library: ' + error.message, 'error');
                });
        }

        function buildCategoryFilters() {
            const categories = new Set();
            libraryData.books.forEach(book => {
                if (book.classifications && book.classifications.length > 0) {
                    book.classifications.forEach(classification => {
                        if (classification.main) {
                            categories.add(classification.main);
                        }
                        if (classification.subs && Array.isArray(classification.subs)) {
                            classification.subs.forEach(sub => {
                                if (sub) categories.add(sub);
                            });
                        }
                    });
                }
            });

            const categoriesArray = Array.from(categories).sort();
            const filterContainer = document.getElementById('categoryFilters');
            filterContainer.innerHTML = categoriesArray.map(category => `
                <div class="filter-checkbox">
                    <input type="checkbox" id="cat_${category}" value="${category}" onchange="filterBooks()">
                    <label for="cat_${category}" style="cursor: pointer; margin: 0;">${escapeHtml(category)}</label>
                </div>
            `).join('');
        }

        function buildRatingFilters() {
            const ratingContainer = document.getElementById('ratingFilters');
            const ratings = ['5 ⭐', '4+ ⭐', '3+ ⭐', 'Unrated'];
            ratingContainer.innerHTML = ratings.map(rating => `
                <div class="filter-checkbox">
                    <input type="checkbox" id="rat_${rating}" value="${rating}" onchange="filterBooks()">
                    <label for="rat_${rating}" style="cursor: pointer; margin: 0;">${rating}</label>
                </div>
            `).join('');
        }

        function toggleFilterPanel() {
            const content = document.getElementById('filterContent');
            const icon = document.getElementById('filterToggleIcon');
            content.classList.toggle('expanded');
            icon.textContent = content.classList.contains('expanded') ? '▼' : '▶';
        }

        function clearFilters() {
            document.getElementById('filterInCollection').checked = false;
            document.querySelectorAll('.filter-checkbox input[type="checkbox"][id^="cat_"]').forEach(checkbox => {
                checkbox.checked = false;
            });
            document.querySelectorAll('.filter-checkbox input[type="checkbox"][id^="rat_"]').forEach(checkbox => {
                checkbox.checked = false;
            });
            document.getElementById('searchInput').value = '';
            filterBooks();
        }

        function loadFromFile() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = function(event) {
                const file = event.target.files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        libraryData = JSON.parse(e.target.result);
                        filteredBooks = libraryData.books;
                        renderBrowseBooks();
                        updateStats();
                        showMessage('Library loaded from file successfully', 'success');
                    } catch (error) {
                        showMessage('Error parsing JSON: ' + error.message, 'error');
                    }
                };
                reader.readAsText(file);
            };
            input.click();
        }

        function updateStats() {
            const stats = {
                total: libraryData.books.length,
                read: libraryData.books.filter(b => b.status === 'read').length,
                toRead: libraryData.books.filter(b => b.status === 'to-read').length,
                inCollection: libraryData.books.filter(b => b.in_collection).length,
                tracked: libraryData.books.filter(b => b.tracking_status).length
            };

            const statsHtml = `
                <div class="stat-card">
                    <div class="stat-number">${stats.total}</div>
                    <div class="stat-label">Total Books</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${stats.read}</div>
                    <div class="stat-label">Books Read</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${stats.inCollection}</div>
                    <div class="stat-label">In Collection</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${stats.tracked}</div>
                    <div class="stat-label">Lent/Lost</div>
                </div>
            `;

            const browse = document.getElementById('browseStats');
            if (browse) browse.innerHTML = statsHtml;
        }

        function renderBrowseBooks() {
            const grid = document.getElementById('booksGrid');
            const noResults = document.getElementById('noResults');

            if (filteredBooks.length === 0) {
                grid.innerHTML = '';
                noResults.style.display = 'block';
                return;
            }

            noResults.style.display = 'none';
            grid.innerHTML = filteredBooks.map((book, index) => {
                const originalIndex = libraryData.books.indexOf(book);
                const statusClass = book.status === 'read' ? 'status-read' : 'status-to-read';
                const trackingHtml = book.tracking_status ? 
                    `<div class="tracking-status">📍 ${book.tracking_status}</div>` : '';
                const favoriteHtml = (book.rating >= 4) ? 
                    `<div class="favorite-badge">⭐ Favorite</div>` : '';

                return `
                    <div class="book-card">
                        ${favoriteHtml}
                        <div class="book-title">${escapeHtml(book.title)}</div>
                        <div class="book-author">by ${escapeHtml(book.author)}</div>
                        <div class="book-status ${statusClass}">${book.status}</div>
                        ${trackingHtml}
                        <div class="book-info">
                            <strong>Rating:</strong> ${book.rating || 'N/A'}/5<br>
                            <strong>Category:</strong> ${book.category || 'N/A'}<br>
                            <strong>Pages:</strong> ${book.pages || 'N/A'}
                        </div>
                        <div class="book-actions">
                            <button class="btn-primary" onclick="editBook(${originalIndex})">✏️ Edit</button>
                            <button class="btn-primary" onclick="openTrackingModal(${originalIndex})">📍 Track</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterBooks() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const inCollectionOnly = document.getElementById('filterInCollection').checked;
            
            // Get selected categories
            selectedCategories.clear();
            document.querySelectorAll('.filter-checkbox input[type="checkbox"][id^="cat_"]:checked').forEach(checkbox => {
                selectedCategories.add(checkbox.value);
            });

            // Get selected ratings
            selectedRatings.clear();
            document.querySelectorAll('.filter-checkbox input[type="checkbox"][id^="rat_"]:checked').forEach(checkbox => {
                selectedRatings.add(checkbox.value);
            });

            filteredBooks = libraryData.books.filter(book => {
                // Text search filter
                const matchesSearch = search === '' || 
                    book.title.toLowerCase().includes(search) || 
                    book.author.toLowerCase().includes(search);

                // In collection filter
                const matchesCollection = !inCollectionOnly || book.in_collection;

                // Category filter
                let matchesCategory = true;
                if (selectedCategories.size > 0) {
                    matchesCategory = false;
                    if (book.classifications && book.classifications.length > 0) {
                        for (const classification of book.classifications) {
                            if (selectedCategories.has(classification.main)) {
                                matchesCategory = true;
                                break;
                            }
                            if (classification.subs && Array.isArray(classification.subs)) {
                                for (const sub of classification.subs) {
                                    if (selectedCategories.has(sub)) {
                                        matchesCategory = true;
                                        break;
                                    }
                                }
                                if (matchesCategory) break;
                            }
                        }
                    }
                }

                // Rating filter
                let matchesRating = true;
                if (selectedRatings.size > 0) {
                    matchesRating = false;
                    if (selectedRatings.has('5 ⭐') && book.rating === 5) matchesRating = true;
                    if (selectedRatings.has('4+ ⭐') && book.rating >= 4) matchesRating = true;
                    if (selectedRatings.has('3+ ⭐') && book.rating >= 3) matchesRating = true;
                    if (selectedRatings.has('Unrated') && !book.rating) matchesRating = true;
                }

                return matchesSearch && matchesCollection && matchesCategory && matchesRating;
            });
            renderBrowseBooks();
        }

        function filterTrackingBooks() {
            const search = document.getElementById('trackingSearch').value.toLowerCase();
            const tracked = libraryData.books.filter(book =>
                (book.title.toLowerCase().includes(search) || 
                 book.author.toLowerCase().includes(search)) &&
                book.tracking_status
            );

            const grid = document.getElementById('trackingGrid');
            if (tracked.length === 0) {
                grid.innerHTML = '<div class="no-results">No tracked books found</div>';
                return;
            }

            grid.innerHTML = tracked.map((book, idx) => {
                const originalIndex = libraryData.books.indexOf(book);
                return `
                    <div class="book-card">
                        <div class="book-title">${escapeHtml(book.title)}</div>
                        <div class="book-author">by ${escapeHtml(book.author)}</div>
                        <div class="tracking-status">📍 ${book.tracking_status}</div>
                        <div class="book-actions">
                            <button class="btn-primary" onclick="openTrackingModal(${originalIndex})">✏️ Update</button>
                            <button class="btn-secondary" onclick="openEditModal(${originalIndex})">🔍 View</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openTrackingModal(index) {
            selectedTrackingBook = index;
            const book = libraryData.books[index];
            document.getElementById('trackingTitle').textContent = `Track: ${book.title}`;
            document.getElementById('lentPerson').value = '';
            document.getElementById('lentDate').value = '';
            document.getElementById('lentForm').style.display = 'none';
            selectedTrackingType = null;
            
            // Reset selection
            document.querySelectorAll('.tracking-option').forEach(opt => {
                opt.classList.remove('selected');
            });

            document.getElementById('trackingModal').classList.add('active');
        }

        function closeTrackingModal() {
            document.getElementById('trackingModal').classList.remove('active');
        }

        function selectTracking(element, type) {
            document.querySelectorAll('.tracking-option').forEach(opt => {
                opt.classList.remove('selected');
            });
            element.classList.add('selected');
            selectedTrackingType = type;

            const lentForm = document.getElementById('lentForm');
            if (type === 'lent') {
                lentForm.style.display = 'block';
            } else {
                lentForm.style.display = 'none';
            }
        }

        function saveTrackingStatus() {
            if (!selectedTrackingType) {
                showMessage('Please select a tracking status', 'error');
                return;
            }

            const book = libraryData.books[selectedTrackingBook];

            if (selectedTrackingType === 'in_collection') {
                book.tracking_status = null;
                showMessage(`✓ "${book.title}" marked as in collection`, 'success');
            } else if (selectedTrackingType === 'lent') {
                const person = document.getElementById('lentPerson').value.trim();
                if (!person) {
                    showMessage('Please enter the person\'s name', 'error');
                    return;
                }
                book.tracking_status = `Lent to ${person}`;
                showMessage(`📤 "${book.title}" marked as lent to ${person}`, 'success');
            } else if (selectedTrackingType === 'lost') {
                book.tracking_status = 'Lost';
                showMessage(`❌ "${book.title}" marked as lost`, 'success');
            }

            updateStats();
            closeTrackingModal();
            filterTrackingBooks();
            renderBrowseBooks();
        }

        function editBook(index) {
            currentEditIndex = index;
            openEditModal(index);
        }

        function openEditModal(index) {
            const book = libraryData.books[index];
            if (!book) {
                showMessage('Error: Book not found at index ' + index, 'error');
                return;
            }
            document.getElementById('editIndex').value = index;
            document.getElementById('editTitle').value = book.title || '';
            document.getElementById('editAuthor').value = book.author || '';
            document.getElementById('editRating').value = book.rating || '';
            document.getElementById('editStatus').value = book.status || 'read';
            document.getElementById('editCategory').value = book.category || '';
            document.getElementById('editInCollection').value = String(book.in_collection);
            document.getElementById('editPages').value = book.pages || '';
            document.getElementById('editReview').value = book.review || '';
            document.getElementById('editTracking').value = book.tracking_status || '';

            document.getElementById('editModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('editModal').classList.remove('active');
        }

        function saveBook(event) {
            event.preventDefault();
            const index = parseInt(document.getElementById('editIndex').value);
            const book = libraryData.books[index];

            book.title = document.getElementById('editTitle').value;
            book.author = document.getElementById('editAuthor').value;
            book.rating = parseInt(document.getElementById('editRating').value) || null;
            book.status = document.getElementById('editStatus').value;
            book.category = document.getElementById('editCategory').value;
            book.in_collection = document.getElementById('editInCollection').value === 'true';
            book.pages = document.getElementById('editPages').value;
            book.review = document.getElementById('editReview').value;
            book.tracking_status = document.getElementById('editTracking').value || null;

            showMessage(`✓ "${book.title}" saved successfully`, 'success');
            closeModal();
            updateStats();
            renderBrowseBooks();
        }

        function deleteBook() {
            const index = parseInt(document.getElementById('editIndex').value);
            const book = libraryData.books[index];

            if (confirm(`Are you sure you want to delete "${book.title}"?`)) {
                libraryData.books.splice(index, 1);
                libraryData.book_count = libraryData.books.length;
                showMessage(`✓ "${book.title}" deleted`, 'success');
                closeModal();
                updateStats();
                renderBrowseBooks();
            }
        }

        function addNewBook(event) {
            event.preventDefault();

            const newBook = {
                title: document.getElementById('newTitle').value,
                author: document.getElementById('newAuthor').value,
                rating: parseInt(document.getElementById('newRating').value) || null,
                status: document.getElementById('newStatus').value,
                category: document.getElementById('newCategory').value || null,
                classifications: [],
                in_collection: document.getElementById('newInCollection').value === 'true',
                condition: null,
                review: document.getElementById('newReview').value || null,
                date_read: new Date().toISOString().split('T')[0].replace(/-/g, '/'),
                date_added: new Date().toISOString().split('T')[0].replace(/-/g, '/'),
                pages: document.getElementById('newPages').value || null,
                avg_rating: null,
                tracking_status: document.getElementById('newTracking').value || null
            };

            libraryData.books.push(newBook);
            libraryData.book_count = libraryData.books.length;

            showMessage(`✓ "${newBook.title}" added successfully`, 'success');
            document.getElementById('addBookForm').reset();
            updateStats();
            filteredBooks = libraryData.books;
            renderBrowseBooks();
        }

        function showSection(sectionId) {
            document.querySelectorAll('.section').forEach(section => {
                section.classList.remove('active');
            });
            document.getElementById(sectionId).classList.add('active');

            if (sectionId === 'tracking') {
                filterTrackingBooks();
            } else if (sectionId === 'browse') {
                document.getElementById('searchInput').value = '';
                filteredBooks = libraryData.books;
                renderBrowseBooks();
            } else if (sectionId === 'dashboard') {
                renderDashboard();
            }
        }

        function renderDashboard() {
            const content = document.getElementById('dashboardContent');
            
            // Calculate statistics
            const allBooks = libraryData.books;
            const readBooks = allBooks.filter(b => b.status === 'read');
            const unreadInCollection = allBooks.filter(b => b.in_collection && b.status === 'to-read');
            const ownedAndLoved = allBooks.filter(b => b.in_collection && b.rating >= 4);
            const ratedBooks = allBooks.filter(b => b.rating);
            const avgRating = ratedBooks.length > 0 ? (ratedBooks.reduce((sum, b) => sum + b.rating, 0) / ratedBooks.length).toFixed(2) : 0;
            const totalPages = allBooks.filter(b => b.pages).reduce((sum, b) => sum + parseInt(b.pages), 0);
            const booksWithPages = allBooks.filter(b => b.pages).length;
            const avgPages = booksWithPages > 0 ? Math.round(totalPages / booksWithPages) : 0;
            
            // Estimate reading speed (books read per month - rough estimate)
            const booksPerMonth = readBooks.length > 0 ? (readBooks.length / 12).toFixed(1) : 0;
            
            // Get top categories from 4-5 star books
            const topCats = {};
            ownedAndLoved.forEach(book => {
                if (book.classifications && book.classifications.length > 0) {
                    book.classifications.forEach(c => {
                        topCats[c.main] = (topCats[c.main] || 0) + 1;
                    });
                }
            });
            const topCategory = Object.keys(topCats).length > 0 ? Object.keys(topCats).reduce((a, b) => topCats[a] > topCats[b] ? a : b) : 'N/A';
            
            const html = `
                <div class="dashboard-grid">
                    <div class="dashboard-card">
                        <h3>📈 Reading Statistics</h3>
                        <div class="dashboard-stat">
                            <div class="dashboard-stat-label">Total Books Read</div>
                            <div class="dashboard-stat-value">${readBooks.length}</div>
                        </div>
                        <div class="dashboard-stat">
                            <div class="dashboard-stat-label">Books/Month Estimate</div>
                            <div class="dashboard-stat-value">${booksPerMonth}</div>
                        </div>
                        <div class="dashboard-stat">
                            <div class="dashboard-stat-label">Avg Pages/Book</div>
                            <div class="dashboard-stat-value">${avgPages}</div>
                        </div>
                        <div class="dashboard-stat">
                            <div class="dashboard-stat-label">Avg Rating</div>
                            <div class="dashboard-stat-value">${avgRating} ⭐</div>
                        </div>
                    </div>

                    <div class="dashboard-card">
                        <h3>📚 Collection Insights</h3>
                        <div class="dashboard-stat">
                            <div class="dashboard-stat-label">Books in Collection</div>
                            <div class="dashboard-stat-value">${allBooks.filter(b => b.in_collection).length}</div>
                        </div>
                        <div class="dashboard-stat">
                            <div class="dashboard-stat-label">Reading Backlog</div>
                            <div class="dashboard-stat-value">${unreadInCollection.length}</div>
                        </div>
                        <div class="dashboard-stat">
                            <div class="dashboard-stat-label">Your Favorites</div>
                            <div class="dashboard-stat-value">${ownedAndLoved.length}</div>
                        </div>
                        <div class="dashboard-stat">
                            <div class="dashboard-stat-label">Top Category</div>
                            <div class="dashboard-stat-value" style="font-size: 1.2em;">${topCategory}</div>
                        </div>
                    </div>
                </div>

                <h3 style="margin-top: 30px; color: #2d3748;">📖 Your Reading Backlog</h3>
                <p style="color: #718096; margin-bottom: 15px;">Books you own but haven't read yet (${unreadInCollection.length} books)</p>
                <div class="books-grid">
                    ${unreadInCollection.slice(0, 6).map(book => {
                        const idx = libraryData.books.indexOf(book);
                        return `
                            <div class="book-card">
                                <div class="book-title">${escapeHtml(book.title)}</div>
                                <div class="book-author">by ${escapeHtml(book.author)}</div>
                                <div class="book-info">
                                    <strong>Category:</strong> ${book.category || 'N/A'}<br>
                                    <strong>Pages:</strong> ${book.pages || 'N/A'}
                                </div>
                                <div class="book-actions">
                                    <button class="btn-primary" onclick="editBook(${idx})">✏️ Edit</button>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
                ${unreadInCollection.length > 6 ? `<p style="text-align: center; color: #667eea; margin-top: 15px;">... and ${unreadInCollection.length - 6} more</p>` : ''}

                <h3 style="margin-top: 30px; color: #2d3748;">💎 Your Favorite Reads</h3>
                <p style="color: #718096; margin-bottom: 15px;">Books you rated 4-5 stars and own (${ownedAndLoved.length} books)</p>
                <div class="books-grid">
                    ${ownedAndLoved.slice(0, 6).map(book => {
                        const idx = libraryData.books.indexOf(book);
                        return `
                            <div class="book-card">
                                <div class="favorite-badge">⭐ ${book.rating}/5</div>
                                <div class="book-title">${escapeHtml(book.title)}</div>
                                <div class="book-author">by ${escapeHtml(book.author)}</div>
                                <div class="book-info">
                                    <strong>Category:</strong> ${book.category || 'N/A'}<br>
                                    <strong>Pages:</strong> ${book.pages || 'N/A'}
                                </div>
                                <div class="book-actions">
                                    <button class="btn-primary" onclick="editBook(${idx})">✏️ Edit</button>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
                ${ownedAndLoved.length > 6 ? `<p style="text-align: center; color: #667eea; margin-top: 15px;">... and ${ownedAndLoved.length - 6} more</p>` : ''}
            `;
            
            content.innerHTML = html;
        }

        function downloadJSON() {
            if (!libraryData) {
                showMessage('Library not loaded', 'error');
                return;
            }

            const dataStr = JSON.stringify(libraryData, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'library_data.json';
            link.click();
            URL.revokeObjectURL(url);
            showMessage('✓ JSON downloaded successfully', 'success');
        }

        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            setTimeout(() => {
                messageDiv.className = 'message';
            }, 5000);
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // GitHub Authentication & Saving
        let githubToken = sessionStorage.getItem('githubToken') || null;
        const REPO_OWNER = 'EnsieT';
        const REPO_NAME = 'My-Library';

        function initGitHub() {
            const githubBtn = document.getElementById('githubBtn');
            const saveGithubBtn = document.getElementById('saveGithubBtn');
            
            if (githubToken) {
                githubBtn.textContent = '✅ GitHub Connected';
                githubBtn.style.background = '#48bb78';
                saveGithubBtn.style.display = 'inline-block';
            } else {
                githubBtn.style.display = 'inline-block';
                githubBtn.textContent = '🔓 Login to GitHub';
            }
        }

        function toggleGitHubAuth() {
            if (githubToken) {
                githubToken = null;
                sessionStorage.removeItem('githubToken');
                document.getElementById('githubBtn').textContent = '🔓 Login to GitHub';
                document.getElementById('saveGithubBtn').style.display = 'none';
                showMessage('✓ GitHub disconnected', 'success');
                initGitHub();
            } else {
                promptGitHubToken();
            }
        }

        function promptGitHubToken() {
            const modal = document.createElement('div');
            modal.className = 'modal active';
            modal.innerHTML = `
                <div class="modal-content">
                    <span class="close-modal" onclick="this.closest('.modal').remove()">&times;</span>
                    <div class="modal-header">GitHub Authentication</div>
                    <p style="margin-bottom: 15px; color: #4a5568;">
                        To save changes to GitHub, you need a Personal Access Token.
                    </p>
                    <div style="background: #f7fafc; padding: 15px; border-radius: 5px; margin-bottom: 15px; font-size: 0.9em;">
                        <strong>Steps to get your token:</strong><br>
                        1. Go to <a href="https://github.com/settings/tokens" target="_blank">GitHub Settings → Personal access tokens</a><br>
                        2. Click "Generate new token (classic)"<br>
                        3. Select scopes: <code>repo</code> (full control of private repositories)<br>
                        4. Generate and copy the token<br>
                        5. Paste it below (only stored in browser memory)
                    </div>
                    <div class="form-group">
                        <label>GitHub Personal Access Token:</label>
                        <input type="password" id="tokenInput" placeholder="ghp_xxxxxxxxxxxx...">
                    </div>
                    <button class="btn-success" onclick="saveToken()" style="width: 100%; margin-bottom: 10px;">Save Token</button>
                    <button class="btn-secondary" onclick="this.closest('.modal').remove()" style="width: 100%;">Cancel</button>
                </div>
            `;
            document.body.appendChild(modal);
        }

        function saveToken() {
            const token = document.getElementById('tokenInput').value.trim();
            if (!token) {
                showMessage('Please enter a token', 'error');
                return;
            }
            
            githubToken = token;
            sessionStorage.setItem('githubToken', token);
            document.querySelector('.modal').remove();
            showMessage('✓ GitHub token saved (browser memory only)', 'success');
            initGitHub();
        }

        async function saveToGitHub() {
            if (!githubToken) {
                showMessage('Please authenticate with GitHub first', 'error');
                return;
            }

            if (!libraryData) {
                showMessage('No library data loaded', 'error');
                return;
            }

            const saveBtn = document.getElementById('saveGithubBtn');
            saveBtn.disabled = true;
            saveBtn.textContent = '⏳ Saving...';

            try {
                // Get current file SHA (needed for update)
                const shaResponse = await fetch(
                    `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/library_data.json`,
                    {
                        headers: {
                            'Authorization': `token ${githubToken}`,
                            'Accept': 'application/vnd.github.v3+json'
                        }
                    }
                );

                if (!shaResponse.ok) {
                    throw new Error('Could not access repo. Check token permissions.');
                }

                const fileData = await shaResponse.json();
                const sha = fileData.sha;

                // Prepare commit data
                const content = btoa(unescape(encodeURIComponent(JSON.stringify(libraryData, null, 2))));
                const message = `Update library via admin panel: ${new Date().toLocaleString()}`;

                // Push to GitHub
                const commitResponse = await fetch(
                    `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/library_data.json`,
                    {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${githubToken}`,
                            'Accept': 'application/vnd.github.v3+json',
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: message,
                            content: content,
                            sha: sha,
                            branch: 'main'
                        })
                    }
                );

                if (!commitResponse.ok) {
                    const error = await commitResponse.json();
                    if (commitResponse.status === 403) {
                        throw new Error('Access denied (403). Your token needs "Contents: Read & Write" permission. API says: ' + (error.message || 'Forbidden'));
                    }
                    if (commitResponse.status === 404) {
                        throw new Error('Repo not found (404). Check REPO_OWNER/REPO_NAME or token scope.');
                    }
                    throw new Error(`HTTP ${commitResponse.status}: ${error.message || 'Failed to commit'}`);
                }

                showMessage('✅ Changes saved to GitHub! 📚', 'success');
            } catch (error) {
                showMessage('❌ Error: ' + error.message, 'error');
                console.error('GitHub save error:', error);
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = '💾 Save to GitHub';
            }
        }

        // Initialize GitHub button on load
        window.addEventListener('DOMContentLoaded', initGitHub);
    </script>
